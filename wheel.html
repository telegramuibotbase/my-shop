<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо Бонусов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stars"></div>
  <div class="stars2"></div>

  <header>
    <a href="index.html" class="logo">← Назад</a>
  </header>

  <main class="wheel-page">
    <div class="wheel-container">
      <div class="wheel-header">
        <div class="wheel-badge"> DAILY SPIN</div>
        <h1 class="wheel-title">Рулетка Бонусов</h1>
        <p class="wheel-subtitle">Испытай удачу и выиграй до <span class="highlight">7,777,777</span> бонусов!</p>
      </div>
      
      <!-- Рулетка -->
      <div class="roulette-wrapper">
        <!-- Указатель по центру -->
        <div class="roulette-pointer">
          <div class="pointer-line"></div>
          <div class="pointer-triangle"></div>
        </div>
        
        <!-- Лента с секторами -->
        <div class="roulette-viewport">
          <div class="roulette-strip" id="roulette-strip">
            <!-- Сектора генерируются через JS -->
          </div>
        </div>
      </div>

      <!-- Кнопка крутить -->
      <button class="btn-spin ready" id="btn-spin" onclick="spinRoulette()">
        <span class="btn-shine"></span>
        <span class="btn-text">🎯 КРУТИТЬ РУЛЕТКУ</span>
      </button>

      <!-- Таймер -->
      <div class="timer-section" id="timer-section" style="display: none;">
        <div class="timer-icon"></div>
        <div class="timer-label">Следующее вращение через:</div>
        <div class="timer-display" id="timer-display">00:00:00</div>
      </div>

      <!-- Сообщение о выигрыше -->
      <div class="win-overlay" id="win-message" style="display: none;">
        <div class="confetti-container" id="confetti"></div>
        <div class="win-card">
          <div class="win-sparkles">✨</div>
          <div class="win-icon" id="win-icon"></div>
          <div class="win-title" id="win-title">ПОЗДРАВЛЯЕМ!</div>
          <div class="win-subtitle">Ты выиграл:</div>
          <div class="win-amount" id="win-amount">+0 🎁</div>
          <button class="btn-claim" onclick="closeWinMessage()">
            <span class="btn-shine"></span>
            ЗАБРАТЬ
          </button>
        </div>
      </div>

      <!-- Сообщение о проигрыше -->
      <div class="lose-overlay" id="lose-message" style="display: none;">
        <div class="lose-card">
          <div class="lose-icon">😔</div>
          <div class="lose-title">Не повезло...</div>
          <div class="lose-subtitle">Попробуй завтра!</div>
          <button class="btn-claim lose-btn" onclick="closeWinMessage()">OK</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
    import { supabaseConfig } from './supabase-config.js';

    const supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);

    let currentUser = null;
    let isSpinning = false;

    // Призы и их шансы
    const prizes = [
      { amount: 0, chance: 40, label: 'Пусто', icon: '😢', color: '#4b5563' },
      { amount: 50, chance: 30, label: '50', icon: '🎁', color: '#10b981' },
      { amount: 100, chance: 20, label: '100', icon: '💎', color: '#3b82f6' },
      { amount: 500, chance: 9.997, label: '500', icon: '🔥', color: '#f59e0b' },
      { amount: 7777777, chance: 0.003, label: '7.7M', icon: '👑', color: '#dc2626' }
    ];

    // Размеры сектора
    const SECTOR_WIDTH = 140; // ширина одного сектора в пикселях
    const TOTAL_SECTORS = 60; // всего секторов в ленте
    const WINNER_INDEX = 50; // индекс выигрышного сектора (ближе к концу)

    async function checkAuth() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;
      generateStrip(); // Генерируем ленту при загрузке
      checkSpinAvailability();
    }

    // Генерация ленты секторов
    function generateStrip() {
      const strip = document.getElementById('roulette-strip');
      strip.innerHTML = '';
      
      for (let i = 0; i < TOTAL_SECTORS; i++) {
        const prize = getRandomPrizeForStrip();
        const sector = document.createElement('div');
        sector.className = 'roulette-sector';
        sector.style.backgroundColor = prize.color;
        sector.innerHTML = `
          <div class="sector-icon">${prize.icon}</div>
          <div class="sector-label">${prize.label}</div>
        `;
        strip.appendChild(sector);
      }
    }

    // Рандомный приз для заполнения ленты (по шансам)
    function getRandomPrizeForStrip() {
      const random = Math.random() * 100;
      let cumulative = 0;
      for (const prize of prizes) {
        cumulative += prize.chance;
        if (random < cumulative) return prize;
      }
      return prizes[0];
    }

    // Выбор выигрышного приза
    function getWinningPrize() {
      const random = Math.random() * 100;
      let cumulative = 0;
      for (const prize of prizes) {
        cumulative += prize.chance;
        if (random < cumulative) return prize;
      }
      return prizes[prizes.length - 1];
    }

    async function checkSpinAvailability() {
      const { data: profile } = await supabase.from('profiles').select('last_spin_at').eq('id', currentUser.id).single();
      if (!profile || !profile.last_spin_at) {
        document.getElementById('btn-spin').style.display = 'block';
        document.getElementById('btn-spin').classList.add('ready');
        document.getElementById('timer-section').style.display = 'none';
        return;
      }
      const lastSpin = new Date(profile.last_spin_at);
      const now = new Date();
      const diff = now - lastSpin;
      const hours24 = 24 * 60 * 60 * 1000;
      if (diff < hours24) {
        document.getElementById('btn-spin').style.display = 'none';
        document.getElementById('btn-spin').classList.remove('ready');
        document.getElementById('timer-section').style.display = 'block';
        startTimer(hours24 - diff);
      } else {
        document.getElementById('btn-spin').style.display = 'block';
        document.getElementById('btn-spin').classList.add('ready');
        document.getElementById('timer-section').style.display = 'none';
      }
    }

    function startTimer(remainingMs) {
      const timerDisplay = document.getElementById('timer-display');
      const interval = setInterval(() => {
        remainingMs -= 1000;
        if (remainingMs <= 0) {
          clearInterval(interval);
          document.getElementById('btn-spin').style.display = 'block';
          document.getElementById('btn-spin').classList.add('ready');
          document.getElementById('timer-section').style.display = 'none';
          return;
        }
        const hours = Math.floor(remainingMs / (1000 * 60 * 60));
        const minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((remainingMs % (1000 * 60)) / 1000);
        timerDisplay.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }

    function createConfetti() {
      const container = document.getElementById('confetti');
      container.innerHTML = '';
      const colors = ['#fbbf24', '#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti-piece';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 3 + 's';
        confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
        container.appendChild(confetti);
      }
    }

    window.spinRoulette = async function() {
      if (isSpinning) return;
      isSpinning = true;

      const strip = document.getElementById('roulette-strip');
      const btnSpin = document.getElementById('btn-spin');
      
      btnSpin.classList.remove('ready');
      btnSpin.disabled = true;
      btnSpin.querySelector('.btn-text').textContent = '🎡 КРУТИМ...';

      // Выбираем выигрышный приз
      const wonPrize = getWinningPrize();

      // Перегенерируем ленту, чтобы выигрышный сектор был на позиции WINNER_INDEX
      generateStrip();
      
      // Заменяем сектор на выигрышной позиции
      const sectors = strip.children;
      const winnerSector = sectors[WINNER_INDEX];
      winnerSector.style.backgroundColor = wonPrize.color;
      winnerSector.innerHTML = `
        <div class="sector-icon">${wonPrize.icon}</div>
        <div class="sector-label">${wonPrize.label}</div>
      `;

      // Вычисляем смещение для остановки на выигрышном секторе
      // Центр viewport = ширина viewport / 2
      const viewport = document.querySelector('.roulette-viewport');
      const viewportWidth = viewport.offsetWidth;
      const centerOffset = viewportWidth / 2;
      
      // Позиция выигрышного сектора (его центр)
      const winnerCenter = (WINNER_INDEX * SECTOR_WIDTH) + (SECTOR_WIDTH / 2);
      
      // Добавляем случайное смещение внутри сектора (±40% ширины)
      const randomOffset = (Math.random() - 0.5) * SECTOR_WIDTH * 0.8;
      
      // Итоговое смещение ленты
      const targetTranslate = -(winnerCenter - centerOffset + randomOffset);

      // Сбрасываем позицию
      strip.style.transition = 'none';
      strip.style.transform = 'translateX(0)';
      
      // Принудительный reflow
      strip.offsetHeight;

      // Запускаем анимацию
      strip.style.transition = 'transform 6s cubic-bezier(0.15, 0.85, 0.25, 1)';
      strip.style.transform = `translateX(${targetTranslate}px)`;

      setTimeout(async () => {
        if (wonPrize.amount > 0) {
          const { data: profile } = await supabase.from('profiles').select('bonus_balance').eq('id', currentUser.id).single();
          const newBalance = (profile?.bonus_balance || 0) + wonPrize.amount;
          await supabase.from('profiles').update({ bonus_balance: newBalance, last_spin_at: new Date().toISOString() }).eq('id', currentUser.id);

          document.getElementById('win-icon').textContent = wonPrize.icon;
          document.getElementById('win-title').textContent = wonPrize.amount === 7777777 ? '🎰 ДЖЕКПОТ! 🎰' : 'ПОЗДРАВЛЯЕМ!';
          document.getElementById('win-amount').textContent = `+${wonPrize.amount.toLocaleString('ru-RU')} 🎁`;
          document.getElementById('win-message').style.display = 'flex';
          
          if (wonPrize.amount >= 500) createConfetti();
        } else {
          await supabase.from('profiles').update({ last_spin_at: new Date().toISOString() }).eq('id', currentUser.id);
          document.getElementById('lose-message').style.display = 'flex';
        }
        
        isSpinning = false;
        btnSpin.disabled = false;
        btnSpin.querySelector('.btn-text').textContent = '🎯 КРУТИТЬ РУЛЕТКУ';
        btnSpin.style.display = 'none';
        document.getElementById('timer-section').style.display = 'block';
        startTimer(24 * 60 * 60 * 1000);
      }, 6000);
    };

    window.closeWinMessage = function() {
      document.getElementById('win-message').style.display = 'none';
      document.getElementById('lose-message').style.display = 'none';
    };

    checkAuth();
  </script>
</body>
</html>
