<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Колесо Бонусов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">← Назад</a>
  </header>

  <main class="wheel-page">
    <div class="wheel-container">
      <h1 class="wheel-title">🎡 Колесо Бонусов</h1>
      <p class="wheel-subtitle">Крути колесо и получай бонусы! Можно крутить раз в день.</p>
      
      <!-- Колесо -->
      <div class="wheel-wrapper">
        <div class="wheel-pointer">▼</div>
        <div class="wheel" id="wheel">
          <div class="wheel-segment segment-1">
            <span class="segment-text">Пусто</span>
          </div>
          <div class="wheel-segment segment-2">
            <span class="segment-text">50 🎁</span>
          </div>
          <div class="wheel-segment segment-3">
            <span class="segment-text">100 🎁</span>
          </div>
          <div class="wheel-segment segment-4">
            <span class="segment-text">500 🎁</span>
          </div>
          <div class="wheel-segment segment-5">
            <span class="segment-text">Пусто</span>
          </div>
          <div class="wheel-segment segment-6">
            <span class="segment-text">50 🎁</span>
          </div>
          <div class="wheel-segment segment-7">
            <span class="segment-text">100 🎁</span>
          </div>
          <div class="wheel-segment segment-8">
            <span class="segment-text">7,777,777 🎁</span>
          </div>
        </div>
      </div>

      <!-- Кнопка крутить -->
      <button class="btn-spin" id="btn-spin" onclick="spinWheel()">
        🎯 КРУТИТЬ
      </button>

      <!-- Таймер -->
      <div class="timer-section" id="timer-section" style="display: none;">
        <div class="timer-label">Следующее вращение через:</div>
        <div class="timer-display" id="timer-display">00:00:00</div>
      </div>

      <!-- Сообщение о выигрыше -->
      <div class="win-message" id="win-message" style="display: none;">
        <div class="win-icon" id="win-icon">🎉</div>
        <div class="win-text" id="win-text">Поздравляем!</div>
        <div class="win-amount" id="win-amount">+0 🎁</div>
        <button class="btn-claim" onclick="closeWinMessage()">Забрать</button>
      </div>

      <!-- Сообщение о пустом выигрыше -->
      <div class="lose-message" id="lose-message" style="display: none;">
        <div class="lose-icon"></div>
        <div class="lose-text">Не повезло...</div>
        <div class="lose-subtext">Попробуй завтра!</div>
        <button class="btn-claim" onclick="closeWinMessage()">OK</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
    import { supabaseConfig } from './supabase-config.js';

    const supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);

    let currentUser = null;
    let isSpinning = false;
    let currentRotation = 0;

    // Призы и их шансы (в процентах)
    const prizes = [
      { amount: 0, chance: 40, label: 'Пусто', icon: '😢' },           // 40%
      { amount: 50, chance: 30, label: '50 бонусов', icon: '🎁' },      // 30%
      { amount: 100, chance: 20, label: '100 бонусов', icon: '🎁' },    // 20%
      { amount: 500, chance: 9.997, label: '500 бонусов', icon: '🎁' }, // 9.997%
      { amount: 7777777, chance: 0.003, label: '7,777,777 бонусов', icon: '🎰' } // 0.003% (ДЖЕКПОТ!)
    ];

    // Проверка авторизации
    async function checkAuth() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      checkSpinAvailability();
    }

    // Проверка, можно ли крутить
    async function checkSpinAvailability() {
      const { data: profile } = await supabase
        .from('profiles')
        .select('last_spin_at')
        .eq('id', currentUser.id)
        .single();

      if (!profile || !profile.last_spin_at) {
        document.getElementById('btn-spin').style.display = 'block';
        document.getElementById('timer-section').style.display = 'none';
        return;
      }

      const lastSpin = new Date(profile.last_spin_at);
      const now = new Date();
      const diff = now - lastSpin;
      const hours24 = 24 * 60 * 60 * 1000;

      if (diff < hours24) {
        document.getElementById('btn-spin').style.display = 'none';
        document.getElementById('timer-section').style.display = 'block';
        startTimer(hours24 - diff);
      } else {
        document.getElementById('btn-spin').style.display = 'block';
        document.getElementById('timer-section').style.display = 'none';
      }
    }

    // Таймер обратного отсчёта
    function startTimer(remainingMs) {
      const timerDisplay = document.getElementById('timer-display');
      
      const interval = setInterval(() => {
        remainingMs -= 1000;
        
        if (remainingMs <= 0) {
          clearInterval(interval);
          document.getElementById('btn-spin').style.display = 'block';
          document.getElementById('timer-section').style.display = 'none';
          return;
        }

        const hours = Math.floor(remainingMs / (1000 * 60 * 60));
        const minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((remainingMs % (1000 * 60)) / 1000);

        timerDisplay.textContent = 
          `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }

    // Взвешенный рандомный выбор приза
    function getRandomPrize() {
      const random = Math.random() * 100; // 0-100
      let cumulative = 0;
      
      for (const prize of prizes) {
        cumulative += prize.chance;
        if (random < cumulative) {
          return prize;
        }
      }
      
      return prizes[prizes.length - 1];
    }

    // Вращение колеса
    window.spinWheel = async function() {
      if (isSpinning) return;
      isSpinning = true;

      const wheel = document.getElementById('wheel');
      const btnSpin = document.getElementById('btn-spin');
      
      btnSpin.disabled = true;
      btnSpin.textContent = '🎡 Крутим...';

      // Выбираем приз по шансам
      const wonPrize = getRandomPrize();
      
      // Определяем индекс сектора (для анимации)
      // Сектора: 0=Пусто, 1=50, 2=100, 3=500, 4=Пусто, 5=50, 6=100, 7=7777777
      let segmentIndex;
      if (wonPrize.amount === 0) {
        segmentIndex = Math.random() < 0.5 ? 0 : 4; // Пусто (сектор 1 или 5)
      } else if (wonPrize.amount === 50) {
        segmentIndex = Math.random() < 0.5 ? 1 : 5; // 50 (сектор 2 или 6)
      } else if (wonPrize.amount === 100) {
        segmentIndex = Math.random() < 0.5 ? 2 : 6; // 100 (сектор 3 или 7)
      } else if (wonPrize.amount === 500) {
        segmentIndex = 3; // 500 (сектор 4)
      } else if (wonPrize.amount === 7777777) {
        segmentIndex = 7; // Джекпот (сектор 8)
      }

      // Вычисляем угол для остановки на нужном секторе
      // Каждый сектор = 45 градусов (360/8)
      // Указатель сверху, поэтому нужно компенсировать
      const segmentAngle = 45;
      const targetRotation = (360 - (segmentIndex * segmentAngle)) + (segmentAngle / 2);
      
      // Минимум 5 полных оборотов + целевой угол
      const spins = 5 + Math.random() * 3;
      const rotation = spins * 360 + targetRotation;
      currentRotation += rotation;

      // Анимация вращения
      wheel.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      // Ждём окончания анимации
      setTimeout(async () => {
        if (wonPrize.amount > 0) {
          // Начисляем бонусы
          const { data: profile } = await supabase
            .from('profiles')
            .select('bonus_balance')
            .eq('id', currentUser.id)
            .single();

          const newBalance = (profile?.bonus_balance || 0) + wonPrize.amount;

          // Обновляем баланс и время последнего спина
          await supabase
            .from('profiles')
            .update({
              bonus_balance: newBalance,
              last_spin_at: new Date().toISOString()
            })
            .eq('id', currentUser.id);

          // Показываем сообщение о выигрыше
          document.getElementById('win-icon').textContent = wonPrize.icon;
          document.getElementById('win-text').textContent = wonPrize.amount === 7777777 ? '🎰 ДЖЕКПОТ! 🎰' : 'Поздравляем!';
          document.getElementById('win-amount').textContent = `+${wonPrize.amount.toLocaleString('ru-RU')} 🎁`;
          document.getElementById('win-message').style.display = 'flex';
        } else {
          // Пустой выигрыш
          await supabase
            .from('profiles')
            .update({
              last_spin_at: new Date().toISOString()
            })
            .eq('id', currentUser.id);
          
          document.getElementById('lose-message').style.display = 'flex';
        }
        
        isSpinning = false;
        btnSpin.disabled = false;
        btnSpin.textContent = '🎯 КРУТИТЬ';
        
        // Скрываем кнопку и показываем таймер
        btnSpin.style.display = 'none';
        document.getElementById('timer-section').style.display = 'block';
        startTimer(24 * 60 * 60 * 1000);
      }, 4000);
    };

    // Закрытие сообщений
    window.closeWinMessage = function() {
      document.getElementById('win-message').style.display = 'none';
      document.getElementById('lose-message').style.display = 'none';
    };

    checkAuth();
  </script>
</body>
</html>
