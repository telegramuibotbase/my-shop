<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">← Назад в магазин</a>
    <div class="admin-badge">👑 Админ-панель</div>
  </header>

  <main class="admin-page">
    <div class="admin-container">
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="orders">📦 Заявки (<span id="orders-count">0</span>)</button>
        <button class="admin-tab" data-tab="products">🛍️ Товары</button>
        <button class="admin-tab" data-tab="users">👥 Пользователи</button>
        <button class="admin-tab" data-tab="bonuses">🎁 Бонусы</button>
      </div>

      <div class="admin-section" id="section-orders">
        <h2>📦 Заявки на оплату</h2>
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">Все</button>
          <button class="filter-btn" data-filter="pending">⏳ Ожидают</button>
          <button class="filter-btn" data-filter="completed">✅ Оплачены</button>
          <button class="filter-btn" data-filter="rejected">❌ Отклонены</button>
        </div>
        <div class="orders-list" id="orders-list"><div class="empty-state">Загрузка...</div></div>
      </div>

      <div class="admin-section" id="section-products" style="display: none;">
        <h2>🛍️ Управление товарами</h2>
        <button class="btn-add-product" onclick="window.openAddProductModal()">+ Добавить товар</button>
        <div class="products-list" id="products-list"><div class="empty-state">Загрузка...</div></div>
      </div>

      <div class="admin-section" id="section-users" style="display: none;">
        <h2> Пользователи</h2>
        <div class="users-list" id="users-list"><div class="empty-state">Загрузка...</div></div>
      </div>

      <div class="admin-section" id="section-bonuses" style="display: none;">
        <h2>🎁 Начисление бонусов</h2>
        <div class="bonus-form">
          <div class="form-group">
            <label>ID пользователя (числовой, например 100001):</label>
            <input type="text" id="bonus-user-id" class="form-input" placeholder="100001">
          </div>
          <div class="form-group">
            <label>Количество бонусов:</label>
            <input type="number" id="bonus-amount" class="form-input" placeholder="1000">
          </div>
          <button class="btn-submit-bonus" onclick="window.addBonus()"> Начислить бонусы</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Модалка управления заказом -->
  <div class="modal" id="confirmOrderModal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Управление заказом</h3>
        <button class="modal-close" onclick="window.closeConfirmModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="order-details" id="order-details"></div>
        <div class="form-group">
          <label>Комментарий админа:</label>
          <textarea id="admin-comment" class="form-input" placeholder="Доставлено на email и т.д."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="window.closeConfirmModal()">Отмена</button>
        <button class="btn-save" onclick="window.confirmOrder()">✅ Подтвердить</button>
        <button class="btn-reject" onclick="window.rejectOrder()">❌ Отклонить</button>
      </div>
    </div>
  </div>

  <!-- Модалка товара (ОБНОВЛЁННАЯ) -->
  <div class="modal" id="addProductModal" style="display: none;">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="product-modal-title">Добавить товар</h3>
        <button class="modal-close" onclick="window.closeAddProductModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <div class="form-group">
            <label>Категория:</label>
            <select id="product-category" class="form-input">
              <option value="soft"> Софт</option>
              <option value="services">🛠️ Услуги</option>
              <option value="bonuses">🎁 Бонусы</option>
            </select>
          </div>
          <div class="form-group">
            <label>Иконка (эмодзи для карточки):</label>
            <input type="text" id="product-icon" class="form-input" placeholder="💻">
          </div>
        </div>

        <div class="form-group">
          <label>Название:</label>
          <input type="text" id="product-title" class="form-input" placeholder="Windows Activator">
        </div>

        <div class="form-group">
          <label>Краткое описание:</label>
          <input type="text" id="product-short-desc" class="form-input" placeholder="Надёжная активация Windows">
        </div>

        <div class="form-group">
          <label>Полное описание:</label>
          <textarea id="product-full-desc" class="form-input" rows="4" placeholder="Подробное описание..."></textarea>
        </div>

        <!-- ЦЕНА И ТИП ОПЛАТЫ -->
        <div class="form-row">
          <div class="form-group">
            <label>Тип оплаты:</label>
            <div class="price-type-selector">
              <label class="price-type-option">
                <input type="radio" name="price-type" value="money" checked onchange="window.switchPriceType('money')">
                <span class="price-type-label">💰 Рубли</span>
              </label>
              <label class="price-type-option">
                <input type="radio" name="price-type" value="bonus" onchange="window.switchPriceType('bonus')">
                <span class="price-type-label">🎁 Бонусы</span>
              </label>
              <label class="price-type-option">
                <input type="radio" name="price-type" value="free" onchange="window.switchPriceType('free')">
                <span class="price-type-label">🆓 Бесплатно</span>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label id="price-label">Цена (в рублях):</label>
            <input type="number" id="product-price" class="form-input" placeholder="150" min="0">
          </div>
        </div>

        <!-- ЗАГРУЗКА ФОТО -->
        <div class="form-group">
          <label>📸 Фотографии товара:</label>
          <div class="image-upload-area">
            <input type="file" id="product-images-input" class="file-input" accept="image/*" multiple onchange="window.previewProductImages(this)">
            <label for="product-images-input" class="image-upload-btn">
              📁 Выбрать фотографии
            </label>
            <span class="upload-hint">Можно выбрать несколько фото (макс. 5, до 2 МБ каждое)</span>
          </div>
          <div class="image-preview-grid" id="image-preview-grid"></div>
          <input type="hidden" id="product-images-urls" value="">
        </div>

        <!-- Эмодзи для галереи (резерв) -->
        <div class="form-group">
          <label>Эмодзи для галереи (если нет фото):</label>
          <input type="text" id="product-images-emoji" class="form-input" placeholder="💻,🖥️,⚙️,✅">
        </div>

        <div class="form-group">
          <label>Характеристики (через запятую):</label>
          <input type="text" id="product-features" class="form-input" placeholder="Мгновенная доставка,Гарантия">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="window.closeAddProductModal()">Отмена</button>
        <button class="btn-save" id="btn-save-product" onclick="window.saveProduct()"> Сохранить</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
    import { supabaseConfig } from './supabase-config.js';

    const supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);
    let currentUser = null;
    let currentOrderId = null;
    let currentProductId = null;
    let currentFilter = 'all';
    let uploadedImageUrls = [];
    let selectedImageFiles = [];

    async function checkAuth() {
      const { data: { user }, error } = await supabase.auth.getUser();
      if (error || !user) {
        alert('Ошибка авторизации. Войдите в аккаунт.');
        window.location.href = 'login.html';
        return;
      }
      currentUser = user;
      console.log('✅ Авторизация:', user.email);
      
      window.loadOrders();
      window.loadProducts();
      window.loadUsers();
    }

    // ===== ЗАЯВКИ =====
    window.loadOrders = async function() {
      console.log('🔄 Загрузка заявок...');
      let query = supabase.from('orders').select('*').order('created_at', { ascending: false });
      if (currentFilter !== 'all') query = query.eq('status', currentFilter);

      const { data: orders, error } = await query;
      const ordersList = document.getElementById('orders-list');
      
      if (error) {
        console.error('❌ Ошибка:', error);
        ordersList.innerHTML = `<div class="empty-state" style="color:red">Ошибка: ${error.message}</div>`;
        return;
      }

      document.getElementById('orders-count').textContent = orders?.length || 0;
      if (!orders || orders.length === 0) {
        ordersList.innerHTML = '<div class="empty-state">Нет заявок</div>';
        return;
      }

      ordersList.innerHTML = orders.map(order => `
        <div class="order-item status-${order.status}">
          <div class="order-info">
            <div class="order-name">${order.product_name}</div>
            <div class="order-date">${new Date(order.created_at).toLocaleString('ru-RU')}</div>
            <div class="order-method">${getPaymentMethodName(order.payment_method)}</div>
            ${order.admin_comment ? `<div class="order-comment">💬 ${order.admin_comment}</div>` : ''}
          </div>
          <div class="order-amount">${order.amount} ${order.price_type === 'bonus' ? '' : '₽'}</div>
          <div class="order-status">${getStatusIcon(order.status)}</div>
          <button class="btn-manage" onclick="window.openConfirmModal('${order.id}')">Управление</button>
        </div>
      `).join('');
    };

    function getPaymentMethodName(method) {
      const names = { card: '💳 Карта BY', donationalerts: ' DonationAlerts', steam: '🎮 Steam' };
      return names[method] || method;
    }

    function getStatusIcon(status) {
      const icons = { pending: '⏳ Ожидает', completed: '✅ Оплачено', rejected: '❌ Отклонено' };
      return icons[status] || status;
    }

    window.openConfirmModal = async function(orderId) {
      currentOrderId = orderId;
      const { data, error } = await supabase.from('orders').select('*').eq('id', orderId).single();
      if (error) { alert('Ошибка: ' + error.message); return; }

      document.getElementById('order-details').innerHTML = `
        <div class="detail-row"><span>Товар:</span><span>${data.product_name}</span></div>
        <div class="detail-row"><span>Сумма:</span><span>${data.amount} ${data.price_type === 'bonus' ? '🎁 бонусов' : '₽'}</span></div>
        <div class="detail-row"><span>Способ:</span><span>${getPaymentMethodName(data.payment_method)}</span></div>
        <div class="detail-row"><span>Статус:</span><span>${getStatusIcon(data.status)}</span></div>
        <div class="detail-row"><span>Дата:</span><span>${new Date(data.created_at).toLocaleString('ru-RU')}</span></div>
      `;
      document.getElementById('admin-comment').value = data.admin_comment || '';
      document.getElementById('confirmOrderModal').style.display = 'flex';
    };

    window.closeConfirmModal = function() {
      document.getElementById('confirmOrderModal').style.display = 'none';
      currentOrderId = null;
    };

    window.confirmOrder = async function() {
      if (!currentOrderId) return;
      const comment = document.getElementById('admin-comment').value.trim();
      
      const { data: order } = await supabase.from('orders').select('user_id, product_name, amount, price_type').eq('id', currentOrderId).single();
      
      const { error } = await supabase.from('orders').update({ 
        status: 'completed', 
        admin_comment: comment, 
        updated_at: new Date().toISOString() 
      }).eq('id', currentOrderId);
      
      if (error) { alert('❌ Ошибка: ' + error.message); return; }

      // Если оплата бонусами - списываем с баланса
      if (order && order.price_type === 'bonus' && order.amount > 0) {
        const { data: profile } = await supabase.from('profiles').select('bonus_balance').eq('id', order.user_id).single();
        if (profile) {
          const newBalance = Math.max(0, (profile.bonus_balance || 0) - order.amount);
          await supabase.from('profiles').update({ bonus_balance: newBalance }).eq('id', order.user_id);
        }
      }

      if (order) {
        await supabase.from('notifications').insert({
          user_id: order.user_id,
          title: '✅ Заказ подтверждён',
          message: `Ваш заказ "${order.product_name}" подтверждён администратором.`
        }).then(r => { if (r.error) console.log('Уведомление:', r.error.message); });
      }

      alert('✅ Заказ подтверждён! Пользователь получил уведомление.');
      window.closeConfirmModal();
      window.loadOrders();
    };

    window.rejectOrder = async function() {
      if (!currentOrderId) return;
      const comment = document.getElementById('admin-comment').value.trim();
      
      const { data: order } = await supabase.from('orders').select('user_id, product_name').eq('id', currentOrderId).single();
      
      const { error } = await supabase.from('orders').update({ 
        status: 'rejected', 
        admin_comment: comment, 
        updated_at: new Date().toISOString() 
      }).eq('id', currentOrderId);
      
      if (error) { alert('❌ Ошибка: ' + error.message); return; }

      if (order) {
        await supabase.from('notifications').insert({
          user_id: order.user_id,
          title: '❌ Заказ отклонён',
          message: `Ваш заказ "${order.product_name}" отклонён. ${comment ? 'Причина: ' + comment : ''}`
        }).then(r => { if (r.error) console.log('Уведомление:', r.error.message); });
      }

      alert('❌ Заказ отклонён! Пользователь получил уведомление.');
      window.closeConfirmModal();
      window.loadOrders();
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        window.loadOrders();
      });
    });

    // ===== ТОВАРЫ =====
    window.loadProducts = async function() {
      console.log('🔄 Загрузка товаров...');
      const { data: products, error } = await supabase.from('products').select('*').order('id', { ascending: true });
      const productsList = document.getElementById('products-list');
      
      if (error) {
        console.error('❌ Ошибка:', error);
        productsList.innerHTML = `<div class="empty-state" style="color:red">Ошибка: ${error.message}</div>`;
        return;
      }
      if (!products || products.length === 0) {
        productsList.innerHTML = '<div class="empty-state">Нет товаров. Добавьте первый!</div>';
        return;
      }
      productsList.innerHTML = products.map(p => {
        const priceDisplay = p.price_type === 'bonus' ? `${p.price} 🎁` : p.price_type === 'free' ? 'Бесплатно' : `${p.price} ₽`;
        const mainImage = p.image_urls && p.image_urls.length > 0 
          ? `<img src="${p.image_urls[0]}" class="product-thumb-img">` 
          : `<div class="product-icon">${p.icon}</div>`;
        return `
        <div class="product-item">
          ${mainImage}
          <div class="product-info">
            <div class="product-name">${p.title}</div>
            <div class="product-category">${p.category}</div>
            <div class="product-price">${priceDisplay}</div>
          </div>
          <div class="product-actions">
            <button class="btn-edit" onclick="window.editProduct(${p.id})">✏️</button>
            <button class="btn-delete" onclick="window.deleteProduct(${p.id})">🗑️</button>
          </div>
        </div>
      `}).join('');
    };

    window.switchPriceType = function(type) {
      const label = document.getElementById('price-label');
      const priceInput = document.getElementById('product-price');
      
      if (type === 'money') {
        label.textContent = 'Цена (в рублях):';
        priceInput.placeholder = '150';
        priceInput.disabled = false;
      } else if (type === 'bonus') {
        label.textContent = 'Цена (в бонусах):';
        priceInput.placeholder = '500';
        priceInput.disabled = false;
      } else {
        label.textContent = 'Цена:';
        priceInput.value = '0';
        priceInput.disabled = true;
      }
    };

    window.previewProductImages = function(input) {
      const grid = document.getElementById('image-preview-grid');
      grid.innerHTML = '';
      selectedImageFiles = [];
      uploadedImageUrls = [];
      
      if (!input.files) return;
      
      const files = Array.from(input.files).slice(0, 5);
      
      files.forEach((file, index) => {
        if (file.size > 2000000) {
          alert(`Файл "${file.name}" слишком большой! Максимум 2 МБ.`);
          return;
        }
        
        selectedImageFiles.push(file);
        
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.createElement('div');
          preview.className = 'image-preview-item';
          preview.innerHTML = `
            <img src="${e.target.result}" class="preview-img">
            <button class="remove-image" onclick="window.removeImage(${index})">×</button>
          `;
          grid.appendChild(preview);
        };
        reader.readAsDataURL(file);
      });
    };

    window.removeImage = function(index) {
      selectedImageFiles.splice(index, 1);
      const input = document.getElementById('product-images-input');
      input.value = '';
      
      const grid = document.getElementById('image-preview-grid');
      grid.innerHTML = '';
      selectedImageFiles.forEach((file, i) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.createElement('div');
          preview.className = 'image-preview-item';
          preview.innerHTML = `
            <img src="${e.target.result}" class="preview-img">
            <button class="remove-image" onclick="window.removeImage(${i})">×</button>
          `;
          grid.appendChild(preview);
        };
        reader.readAsDataURL(file);
      });
    };

    window.openAddProductModal = function() {
      currentProductId = null;
      uploadedImageUrls = [];
      selectedImageFiles = [];
      document.getElementById('product-modal-title').textContent = 'Добавить товар';
      document.getElementById('product-category').value = 'soft';
      document.getElementById('product-icon').value = '';
      document.getElementById('product-title').value = '';
      document.getElementById('product-short-desc').value = '';
      document.getElementById('product-full-desc').value = '';
      document.getElementById('product-price').value = '';
      document.getElementById('product-price').disabled = false;
      document.getElementById('product-images-emoji').value = '';
      document.getElementById('product-features').value = '';
      document.getElementById('product-images-input').value = '';
      document.getElementById('image-preview-grid').innerHTML = '';
      document.querySelector('input[name="price-type"][value="money"]').checked = true;
      window.switchPriceType('money');
      document.getElementById('addProductModal').style.display = 'flex';
    };

    window.closeAddProductModal = function() {
      document.getElementById('addProductModal').style.display = 'none';
      currentProductId = null;
      uploadedImageUrls = [];
      selectedImageFiles = [];
    };

    window.editProduct = async function(productId) {
      currentProductId = productId;
      const { data: product, error } = await supabase.from('products').select('*').eq('id', productId).single();
      if (error) { alert('Ошибка: ' + error.message); return; }

      document.getElementById('product-modal-title').textContent = 'Редактировать товар';
      document.getElementById('product-category').value = product.category;
      document.getElementById('product-icon').value = product.icon;
      document.getElementById('product-title').value = product.title;
      document.getElementById('product-short-desc').value = product.short_desc;
      document.getElementById('product-full-desc').value = product.full_desc;
      document.getElementById('product-price').value = product.price;
      document.getElementById('product-images-emoji').value = (product.images || []).join(',');
      document.getElementById('product-features').value = (product.features || []).join(',');
      
      // Тип цены
      const priceType = product.price_type || 'money';
      document.querySelector(`input[name="price-type"][value="${priceType}"]`).checked = true;
      window.switchPriceType(priceType);
      
      // Показываем существующие фото
      uploadedImageUrls = product.image_urls || [];
      const grid = document.getElementById('image-preview-grid');
      grid.innerHTML = '';
      uploadedImageUrls.forEach((url, i) => {
        const preview = document.createElement('div');
        preview.className = 'image-preview-item';
        preview.innerHTML = `
          <img src="${url}" class="preview-img">
          <button class="remove-image" onclick="window.removeExistingImage(${i})">×</button>
        `;
        grid.appendChild(preview);
      });
      
      document.getElementById('addProductModal').style.display = 'flex';
    };

    window.removeExistingImage = function(index) {
      uploadedImageUrls.splice(index, 1);
      const grid = document.getElementById('image-preview-grid');
      grid.innerHTML = '';
      uploadedImageUrls.forEach((url, i) => {
        const preview = document.createElement('div');
        preview.className = 'image-preview-item';
        preview.innerHTML = `
          <img src="${url}" class="preview-img">
          <button class="remove-image" onclick="window.removeExistingImage(${i})">×</button>
        `;
        grid.appendChild(preview);
      });
    };

    window.saveProduct = async function() {
      const btn = document.getElementById('btn-save-product');
      btn.disabled = true;
      btn.textContent = '⏳ Сохранение...';

      try {
        const priceType = document.querySelector('input[name="price-type"]:checked').value;
        
        const productData = {
          category: document.getElementById('product-category').value,
          icon: document.getElementById('product-icon').value,
          title: document.getElementById('product-title').value,
          short_desc: document.getElementById('product-short-desc').value,
          full_desc: document.getElementById('product-full-desc').value,
          price: parseInt(document.getElementById('product-price').value) || 0,
          price_type: priceType,
          images: document.getElementById('product-images-emoji').value.split(',').map(s => s.trim()).filter(s => s),
          features: document.getElementById('product-features').value.split(',').map(s => s.trim()).filter(s => s),
          is_bonus: priceType === 'bonus' || priceType === 'free'
        };

        if (!productData.title || !productData.icon) {
          alert('Заполните название и иконку!');
          btn.disabled = false;
          btn.textContent = '💾 Сохранить';
          return;
        }

        // Загружаем новые фото в Storage
        if (selectedImageFiles.length > 0) {
          const newUrls = [];
          for (const file of selectedImageFiles) {
            const fileExt = file.name.split('.').pop();
            const fileName = `${currentUser.id}/${Date.now()}_${Math.random().toString(36).substr(2, 9)}.${fileExt}`;
            
            const { error: uploadError } = await supabase.storage
              .from('product-images')
              .upload(fileName, file);

            if (uploadError) {
              alert('Ошибка загрузки фото: ' + uploadError.message);
              btn.disabled = false;
              btn.textContent = '💾 Сохранить';
              return;
            }

            const { data: fileData } = supabase.storage
              .from('product-images')
              .getPublicUrl(fileName);

            newUrls.push(fileData.publicUrl);
          }
          
          // Объединяем старые и новые URL
          productData.image_urls = [...uploadedImageUrls, ...newUrls];
        } else {
          productData.image_urls = uploadedImageUrls;
        }

        let error;
        if (currentProductId) {
          const result = await supabase.from('products').update(productData).eq('id', currentProductId);
          error = result.error;
        } else {
          const result = await supabase.from('products').insert(productData);
          error = result.error;
        }

        if (error) {
          alert('❌ Ошибка: ' + error.message);
          btn.disabled = false;
          btn.textContent = '💾 Сохранить';
          return;
        }

        alert('✅ Товар сохранён!');
        window.closeAddProductModal();
        window.loadProducts();
      } catch (e) {
        alert('Ошибка: ' + e.message);
      }

      btn.disabled = false;
      btn.textContent = '💾 Сохранить';
    };

    window.deleteProduct = async function(productId) {
      if (!confirm('Удалить этот товар?')) return;
      const { error } = await supabase.from('products').delete().eq('id', productId);
      if (error) { alert('❌ Ошибка: ' + error.message); return; }
      alert('🗑️ Товар удалён!');
      window.loadProducts();
    };

    // ===== ПОЛЬЗОВАТЕЛИ =====
    window.loadUsers = async function() {
      console.log('🔄 Загрузка пользователей...');
      const { data: users, error } = await supabase.from('profiles').select('id, user_id, name, avatar_url, bonus_balance').order('created_at', { ascending: false });
      const usersList = document.getElementById('users-list');
      
      if (error) {
        console.error('❌ Ошибка:', error);
        usersList.innerHTML = `<div class="empty-state" style="color:red">Ошибка: ${error.message}</div>`;
        return;
      }
      if (!users || users.length === 0) {
        usersList.innerHTML = '<div class="empty-state">Нет пользователей</div>';
        return;
      }
      usersList.innerHTML = users.map(u => `
        <div class="user-item">
          <img src="${u.avatar_url || 'https://via.placeholder.com/40'}" class="user-avatar">
          <div class="user-info">
            <div class="user-name">${u.name || 'Без имени'}</div>
            <div class="user-id">ID: ${u.user_id || 'Не указан'}</div>
            <div class="user-bonus">🎁 Баланс: ${u.bonus_balance || 0}</div>
          </div>
          <button class="btn-manage" onclick="window.quickAddBonus('${u.user_id}')"> + Бонус</button>
        </div>
      `).join('');
    };

    window.quickAddBonus = function(userId) {
      if (!userId) { alert('У пользователя нет ID'); return; }
      document.getElementById('bonus-user-id').value = userId;
      document.querySelector('[data-tab="bonuses"]').click();
    };

    // ===== БОНУСЫ =====
    window.addBonus = async function() {
      const userId = document.getElementById('bonus-user-id').value.trim();
      const amount = parseInt(document.getElementById('bonus-amount').value);
      if (!userId || !amount) { alert('Заполните ID и количество!'); return; }

      const { data: profile, error: findError } = await supabase
        .from('profiles')
        .select('id, user_id, bonus_balance, name')
        .eq('user_id', parseInt(userId))
        .single();
      
      if (findError || !profile) { 
        alert('❌ Пользователь с ID ' + userId + ' не найден!'); 
        return; 
      }

      const newBalance = (profile.bonus_balance || 0) + amount;
      const { error: updateError } = await supabase
        .from('profiles')
        .update({ bonus_balance: newBalance })
        .eq('id', profile.id);
      
      if (updateError) { alert('❌ Ошибка: ' + updateError.message); return; }

      await supabase.from('notifications').insert({
        user_id: profile.id,
        title: '🎁 Бонусы начислены',
        message: `Администратор начислил вам ${amount} бонусов!`
      }).then(r => { if (r.error) console.log('Уведомление:', r.error.message); });

      alert(`✅ Начислено ${amount} бонусов пользователю ${profile.name}!`);
      document.getElementById('bonus-user-id').value = '';
      document.getElementById('bonus-amount').value = '';
      window.loadUsers();
    };

    document.querySelectorAll('.admin-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
        document.getElementById(`section-${tab.dataset.tab}`).style.display = 'block';
      });
    });

    checkAuth();
  </script>
</body>
</html>
