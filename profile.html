<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - My Shop</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <!-- Шапка сайта -->
    <header>
        <a href="index.html" class="logo">My Shop</a>
        <div class="user-menu" id="avatar-btn" style="display: none;">
            <div class="avatar-circle">
                <img id="user-avatar" src="https://via.placeholder.com/40" alt="Avatar">
            </div>
            <div class="dropdown" id="dropdown">
                <button onclick="window.location.href='profile.html'">👤 Мой профиль</button>
                <button class="logout" id="logout-btn">🚪 Выйти</button>
            </div>
        </div>
    </header>

    <!-- Основной контент профиля -->
    <main class="profile-page">
        <div class="profile-card">
            
            <!-- Контейнер для идеального центрирования ID и Аватарки -->
            <div class="profile-header-center">
                <div class="user-id" id="display-user-id">ID: Загрузка...</div>
                
                <div class="avatar-wrapper">
                    <img id="profile-big-avatar" class="big-avatar" src="https://via.placeholder.com/140" alt="Profile Avatar">
                    <div class="avatar-badge">DISCORD</div>
                </div>
            </div>

            <h1 class="profile-name" id="display-user-name">Загрузка...</h1>
            <button class="btn-edit-small" id="btn-edit-profile">✏️ Редактировать профиль</button>

            <!-- Балансы (стиль сохранен) -->
            <div class="balances-container">
                <div class="balances-title">Ваши балансы</div>
                <div class="balances-row">
                    <div class="balance-card balance-main">
                        <div class="balance-icon">💎</div>
                        <div class="balance-label">Основной баланс</div>
                        <div class="balance-amount">0 ₽</div>
                        <button class="balance-action-btn btn-topup">Пополнить</button>
                    </div>
                    <div class="balance-card balance-bonus">
                        <div class="balance-icon">🎁</div>
                        <div class="balance-label">Бонусный баланс</div>
                        <div class="balance-amount">0 ₽</div>
                        <button class="balance-action-btn btn-bonus-info">Подробнее</button>
                    </div>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
