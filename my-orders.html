<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои заказы</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">← Назад</a>
    <div class="notifications-icon" onclick="window.showNotifications()">
      🔔 <span id="notif-count" style="display:none">0</span>
    </div>
  </header>

  <main class="orders-page">
    <div class="orders-container">
      <h1>🛍️ Мои заказы</h1>
      <div class="orders-list" id="orders-list">
        <div class="empty-state">Загрузка...</div>
      </div>
    </div>
  </main>

  <!-- Уведомления -->
  <div class="modal" id="notifModal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🔔 Уведомления</h3>
        <button class="modal-close" onclick="window.closeNotifications()">×</button>
      </div>
      <div class="modal-body" id="notif-list">
        <div class="empty-state">Нет уведомлений</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
    import { supabaseConfig } from './supabase-config.js';

    const supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);
    let currentUser = null;

    async function loadOrders() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;

      const { data: orders, error } = await supabase
        .from('orders')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false });

      const ordersList = document.getElementById('orders-list');
      
      if (error) {
        ordersList.innerHTML = `<div class="empty-state">Ошибка: ${error.message}</div>`;
        return;
      }

      if (!orders || orders.length === 0) {
        ordersList.innerHTML = '<div class="empty-state">У вас пока нет заказов</div>';
        return;
      }

      ordersList.innerHTML = orders.map(order => `
        <div class="order-card status-${order.status}">
          <div class="order-header">
            <div class="order-name">${order.product_name}</div>
            <div class="order-status-badge">${getStatusBadge(order.status)}</div>
          </div>
          <div class="order-body">
            <div class="order-row">
              <span>💰 Сумма:</span>
              <span>${order.amount} ₽</span>
            </div>
            <div class="order-row">
              <span>📅 Дата:</span>
              <span>${new Date(order.created_at).toLocaleString('ru-RU')}</span>
            </div>
            <div class="order-row">
              <span>💳 Способ:</span>
              <span>${getPaymentMethod(order.payment_method)}</span>
            </div>
            ${order.admin_comment ? `
            <div class="order-row">
              <span>💬 Комментарий админа:</span>
              <span>${order.admin_comment}</span>
            </div>` : ''}
          </div>
        </div>
      `).join('');

      loadNotifications();
    }

    function getStatusBadge(status) {
      const badges = {
        pending: '<span style="color:#fbbf24"> Ожидает</span>',
        completed: '<span style="color:#10b981">✅ Оплачено</span>',
        rejected: '<span style="color:#ef4444">❌ Отклонено</span>'
      };
      return badges[status] || status;
    }

    function getPaymentMethod(method) {
      const methods = {
        card: '💳 Карта BY',
        donationalerts: '🌐 DonationAlerts',
        steam: '🎮 Steam'
      };
      return methods[method] || method;
    }

    window.loadNotifications = async function() {
      const { data: notifs } = await supabase
        .from('notifications')
        .select('*')
        .eq('user_id', currentUser.id)
        .eq('is_read', false)
        .order('created_at', { ascending: false });

      const count = notifs?.length || 0;
      const countEl = document.getElementById('notif-count');
      
      if (count > 0) {
        countEl.textContent = count;
        countEl.style.display = 'inline-block';
      }
    };

    window.showNotifications = async function() {
      const { data: notifs } = await supabase
        .from('notifications')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      const list = document.getElementById('notif-list');
      if (!notifs || notifs.length === 0) {
        list.innerHTML = '<div class="empty-state">Нет уведомлений</div>';
      } else {
        list.innerHTML = notifs.map(n => `
          <div class="notif-item ${n.is_read ? 'read' : ''}">
            <div class="notif-title">${n.title}</div>
            <div class="notif-message">${n.message}</div>
            <div class="notif-time">${new Date(n.created_at).toLocaleString('ru-RU')}</div>
          </div>
        `).join('');
        
        // Помечаем как прочитанные
        notifs.forEach(n => {
          if (!n.is_read) {
            supabase.from('notifications').update({ is_read: true }).eq('id', n.id);
          }
        });
        loadNotifications();
      }
      
      document.getElementById('notifModal').style.display = 'flex';
    };

    window.closeNotifications = function() {
      document.getElementById('notifModal').style.display = 'none';
    };

    loadOrders();
  </script>
</body>
</html>
