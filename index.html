<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Магазин</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo">🛍 Мой Магазин</div>
    
    <div class="user-menu" id="user-menu">
      <div class="avatar-circle" id="avatar-btn" style="display: none;">
        <img id="user-avatar" src="" alt="avatar">
      </div>
      
      <div class="dropdown" id="dropdown">
        <button onclick="location.href='profile.html'">👤 Профиль</button>
        <button onclick="location.href='profile.html#settings'">⚙️ Настройки</button>
        <button onclick="alert('Поддержка: @support')">💬 Поддержка</button>
        <button id="logout-btn" class="logout">🚪 Выйти</button>
      </div>
    </div>
  </header>

  <main class="catalog-page">
    <div class="catalog-header">
      <h1>Каталог товаров</h1>
      <p>Выберите категорию, чтобы увидеть предложения</p>
    </div>

    <div class="catalog-tabs">
      <button class="tab-btn active" data-category="all">🔥 Все</button>
      <button class="tab-btn" data-category="soft">💻 СОФТ</button>
      <button class="tab-btn" data-category="services"> УСЛУГИ</button>
      <button class="tab-btn" data-category="bonuses"> БОНУСЫ</button>
    </div>

    <div class="product-grid" id="product-grid"></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
